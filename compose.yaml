# Development database only. The API defaults to mongodb://127.0.0.1:27017/taskflow-dev.
services:
  mongo:
    image: mongo:8.2
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - taskflow-mongo:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  taskflow-mongo:
